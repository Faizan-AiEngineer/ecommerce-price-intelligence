version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: priceintel-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: priceintel
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d priceintel"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: priceintel-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/priceintel
      API_V1_PREFIX: /api/v1
      AUTH_REQUIRED: "false"
      BASE_CURRENCY: USD
      COLLECTION_INTERVAL_MINUTES: 60
      SCHEDULER_TIMEZONE: UTC
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "python -m app.db.bootstrap_demo &&
             exec uvicorn app.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/v1/health"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 60s

  scheduler:
    build:
      context: ./backend
    container_name: priceintel-scheduler
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/priceintel
      API_V1_PREFIX: /api/v1
      AUTH_REQUIRED: "false"
      BASE_CURRENCY: USD
      COLLECTION_INTERVAL_MINUTES: 60
      SCHEDULER_TIMEZONE: UTC
    depends_on:
      backend:
        condition: service_healthy
    command: python -m app.scheduler.worker

  frontend:
    build:
      context: ./frontend
    container_name: priceintel-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:80:80"
      - "127.0.0.1:5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
